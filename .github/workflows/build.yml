name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK & NDK 21
      uses: android-actions/setup-android@v3

    - name: Install SDK 29 and Tools
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platforms;android-29" "build-tools;29.0.3" "ndk;21.4.7075588"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug -Pandroid.defaults.buildfeatures.renderscript.enable=true
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.ndk-path }}

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: HDRCam-APK
        path: "**/build/outputs/apk/debug/*.apk"
